name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build for
        required: true
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: Build profile (from eas.json)
        required: true
        type: choice
        options:
          - development
          - preview
          - preview-release
          - production

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AnimalAdventures

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: AnimalAdventures/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Start build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait

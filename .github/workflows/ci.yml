name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AnimalAdventures

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: AnimalAdventures/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # No TypeScript config in this project, so there is no type-check step.
      # No test suite is configured yet (no jest/test script), so there is no
      # test step. Add one here once tests exist.

      - name: Build (bundle JS with Metro)
        run: npx expo export --platform android --no-bytecode --no-minify --output-dir /tmp/ci-build

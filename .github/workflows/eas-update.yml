name: EAS Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel/branch
        required: true
        type: choice
        options:
          - staging-dev
          - staging
          - production
      message:
        description: Update message
        required: true
        type: string

jobs:
  update:
    name: publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AnimalAdventures

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: AnimalAdventures/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish update
        run: eas update --branch ${{ inputs.channel }} --message "${{ inputs.message }}" --non-interactive
